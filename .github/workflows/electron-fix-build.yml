name: Electron fix build (win)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        default: fix/installer-handoff-w2
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          repository: memrynote/memry
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build the branch with the rehearsal feed
        shell: bash
        run: |
          git tag vfix HEAD
          node scripts/rehearsal/build-electron-rehearsal.mjs vfix memrynote/memry-update-rehearsal --keep
          mkdir -p electron-out
          dist=".worktrees/electron-rehearsal-vfix/apps/desktop/dist"
          cp "$dist"/*-setup.exe electron-out/
      - uses: actions/upload-artifact@v4
        with:
          name: MemryNote-fixbuild-rehearsal-windows-2022
          path: electron-out/
          if-no-files-found: error
