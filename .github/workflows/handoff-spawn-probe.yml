name: Handoff Spawn Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: spawn like installer-handoff.ts
        shell: bash
        run: |
          cat > t.cmd <<'EOF'
          @echo off
          tasklist /FI "PID eq 5040" /FI "IMAGENAME eq Memrynote.exe" /NH 2>nul | find /I "Memrynote.exe" >nul
          echo done errorlevel=%errorlevel% > t.out
          EOF
          sed -i 's/^          //' t.cmd
          cat > sp.js <<'EOF'
          require('child_process').spawn('cmd.exe',['/c',process.cwd()+'\\t.cmd'],{detached:true,stdio:'ignore',windowsHide:true}).unref()
          EOF
          sed -i 's/^          //' sp.js
          node sp.js
          sleep 10
          if [ -f t.out ]; then cat t.out; else echo "HUNG: no t.out"; tasklist | grep -i find || true; fi
