name: Handoff probe
on:
  workflow_dispatch:
    inputs:
      source_ref:
        default: fix/installer-handoff-w2
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
        app: [alive, gone]
    runs-on: ${{ matrix.os }}
    env:
      APP_STATE: ${{ matrix.app }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: memrynote/memry
          ref: ${{ inputs.source_ref }}
          sparse-checkout: |
            apps/desktop/src/main/installer-handoff-script.ts
            apps/desktop/scripts/installer-handoff-script.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production script, production spawn options, app already quitting
        shell: pwsh
        run: |
          $sys = "$env:SystemRoot\System32"
          $root = "$env:RUNNER_TEMP\probe"
          Remove-Item $root -Recurse -Force -EA SilentlyContinue
          $install = "$root\Programs\Memrynote"
          New-Item -ItemType Directory -Force $install, "$root\logs" | Out-Null
          Copy-Item "$sys\ping.exe" "$install\Memrynote.exe"
          Copy-Item "$sys\whoami.exe" "$install\Uninstall MemryNote.exe"
          Copy-Item "$sys\whoami.exe" "$root\Setup.exe"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\MemryNote\current" | Out-Null
          Copy-Item "$sys\whoami.exe" "$env:LOCALAPPDATA\MemryNote\current\Memrynote.exe"
          $app = Start-Process "$install\Memrynote.exe" -ArgumentList '-n','15','127.0.0.1' -PassThru -WindowStyle Hidden
          if ($env:APP_STATE -eq 'gone') { $app.Kill(); $app.WaitForExit() }
          $t0 = Get-Date
          node apps/desktop/scripts/installer-handoff-script.mjs --pid $app.Id --exe Memrynote.exe --install-dir $install --setup "$root\Setup.exe" --log "$root\logs\velopack-setup.log" --spawn "$root\handoff.cmd"
          "spawned; node exited"
          $log = "$root\logs\installer-handoff.log"
          for ($i = 0; $i -lt 150; $i++) { if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'handoff done' -Quiet)) { break }; Start-Sleep 1 }
          "elapsed since app start: $([int]((Get-Date) - $t0).TotalSeconds) s (app lives 15 s)"
          Get-Content $log
          $t = Get-Content $log -Raw
          foreach ($step in 'handoff start', 'app exited', 'uninstall exit=\d+', 'setup exit=\d+', 'result=velopack', 'handoff done') { if ($t -notmatch $step) { throw "log lacks '$step'" } }
