name: W2 hand-off (fix build)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        default: fix/installer-handoff-w2
      build_run:
        description: run id of electron-fix-build.yml
        required: true
jobs:
  w2:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: memrynote/memry
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download the Electron NSIS build of the branch
        shell: bash
        run: gh run download ${{ inputs.build_run }} -R memrynote/memry-update-rehearsal -D electron -p 'MemryNote-fixbuild-rehearsal-*'
      - name: Install NSIS build and drive the update
        shell: pwsh
        run: |
          $setup = (Get-ChildItem electron -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $exe = "$env:LOCALAPPDATA\Programs\Memrynote\Memrynote.exe"
          if (-not (Test-Path $exe)) { throw 'NSIS install produced no Memrynote.exe' }
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | % { $p = Get-ItemProperty $_.PSPath; "$($_.PSChildName) | $($p.DisplayName)" } | ? { $_ -match 'emry' }
          New-Item -ItemType Directory -Force "$env:APPDATA\@memry\desktop\logs" | Out-Null
          Start-Process $exe -ArgumentList '--remote-debugging-port=9222'
          Start-Sleep 30
          node scripts/rehearsal/drive-electron-update.mjs 9222 --timeout-s 600
          Start-Sleep 120
      - name: Evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\@memry\desktop" -Name | Select-Object -First 40
          Get-ChildItem $env:APPDATA -Recurse -Filter installer-handoff.log -EA SilentlyContinue | % { $_.FullName; Get-Content $_.FullName }
          Get-ChildItem $env:APPDATA -Recurse -Filter velopack-setup.log -EA SilentlyContinue | % { $_.FullName; Get-Content $_.FullName -Tail 40 }
          "--- uninstall key (expect none)"
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | % { $p = Get-ItemProperty $_.PSPath; "$($_.PSChildName) | $($p.DisplayName)" } | ? { $_ -match 'emry' }
          "--- LOCALAPPDATA\MemryNote"
          Get-ChildItem $env:LOCALAPPDATA\MemryNote -Name -EA SilentlyContinue
          Get-Content $env:LOCALAPPDATA\MemryNote\current\sq.version -EA SilentlyContinue | Select-String '<version>|<rid>|<channel>'
          "--- resources\app.asar"
          Test-Path $env:LOCALAPPDATA\MemryNote\current\resources\app.asar
          "--- Tauri log"
          Get-Content $env:LOCALAPPDATA\com.memrynote.memry\logs\main.log -EA SilentlyContinue | Select-Object -Last 8
      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          "--- hand-off script leftovers"
          Get-ChildItem $env:TEMP -Filter 'memry-installer-handoff*' -EA SilentlyContinue | % { "$($_.Name) $($_.LastWriteTime)" }
          "--- any handoff or velopack-setup logs"
          Get-ChildItem $env:USERPROFILE -Recurse -Include 'installer-handoff.log','velopack-setup.log' -EA SilentlyContinue | % { $_.FullName; Get-Content $_.FullName }
          "--- NSIS dir"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Memrynote" -EA SilentlyContinue | select -First 8 | % Name
          "--- NSIS key"
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | % { Get-ItemProperty $_.PSPath } | ? { $_.DisplayName -match 'emry' } | % { "$($_.PSChildName) | $($_.UninstallString) | $($_.DisplayVersion)" }
          "--- running"
          Get-Process | ? { $_.Name -match 'emry|Setup|Uninstall|cmd' } | % { "$($_.Id) $($_.Name) $($_.Path)" }
          "--- main.log tail (Electron)"
          Get-Content "$env:APPDATA\memrynote\logs\main.log" -EA SilentlyContinue | Select-String 'hand-off|Handoff|quitting|Shutdown' | select -Last 8 | % Line
      - name: Full Electron log
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\memrynote\logs" -Name -EA SilentlyContinue
          Get-Content "$env:APPDATA\memrynote\logs\main.log" -EA SilentlyContinue | Select-String 'InstallerHandoff|hand-off|Updater\)|Shutdown\) +\] installing' | % Line | Select-Object -First 40
